erif" font-size="16.25" lengthAdjust="spacing" textLength="795.8443" x="15" y="87.8213">Non-borrowable zone: scheduler/graph/patch format remains bespoke to JesusCrust&#8217;s reactivity surface.</text><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="474.6142" x="15" y="109.9538">Host adapter + telemetry surface stays minimal and JC-owned.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="34" id="ent0024"><path d="M1457.7875,412.175 L1457.7875,446.625 L1409.325,451.625 L1457.7875,456.625 L1457.7875,491.0726 A0,0 0 0 0 1457.7875,491.0726 L2044.3054,491.0726 A0,0 0 0 0 2044.3054,491.0726 L2044.3054,424.675 L2031.8054,412.175 L1457.7875,412.175 A0,0 0 0 0 1457.7875,412.175" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.625;"/><path d="M2031.8054,412.175 L2031.8054,424.675 L2044.3054,424.675 L2031.8054,412.175" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.625;"/><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="311.4315" x="1465.2875" y="435.7963">Current state: JC harness is independent.</text><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="560.2679" x="1465.2875" y="457.9288">Future research only: Brimstone may inform semantics probes or tooling.</text><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="493.1879" x="1465.2875" y="480.0613">Borrowed test/fuzz patterns extend this harness or run beside it.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="40" id="ent0027"><path d="M1379.9875,1069.675 L1379.9875,1082 L1321.775,1087 L1379.9875,1092 L1379.9875,1104.3075 A0,0 0 0 0 1379.9875,1104.3075 L2054.5967,1104.3075 A0,0 0 0 0 2054.5967,1104.3075 L2054.5967,1082.175 L2042.0967,1069.675 L1379.9875,1069.675 A0,0 0 0 0 1379.9875,1069.675" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.625;"/><path d="M2042.0967,1069.675 L2042.0967,1082.175 L2054.5967,1082.175 L2042.0967,1069.675" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.625;"/><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="648.3592" x="1387.4875" y="1093.2963">Brimstone is a standalone JS engine; DOM access remains gated by JesusCrust&#8217;s host.</text></g><!--link App to Host--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="19" id="lnk12"><path d="M1460.3375,142.3875 C1441.2125,163.4125 1416.825,186.9 1391.05,203.25 C1367.7375,218.0375 1348.0348,227.658 1321.7848,237.6455" fill="none" id="App-to-Host" style="stroke:#181818;stroke-width:1.25;"/><polygon fill="#181818" points="1314.775,240.3125,1327.0677,240.9851,1320.6165,238.09,1323.5116,231.6387,1314.775,240.3125" style="stroke:#181818;stroke-width:1.25;"/><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="261.6415" x="1422.625" y="198.1213">batched patch intent, input events</text></g><!--link Host to RustCore--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="20" id="lnk13"><path d="M1165.55,240.15 C1154.4875,221.9875 1140.8125,199.5625 1128.55,179.5 C1118.45,162.9875 1111.157,151.0819 1101.6945,135.6444" fill="none" id="Host-to-RustCore" style="stroke:#181818;stroke-width:1.25;"/><polygon fill="#181818" points="1097.775,129.25,1099.3913,141.4545,1101.0412,134.5786,1107.9171,136.2286,1097.775,129.25" style="stroke:#181818;stroke-width:1.25;"/><text fill="#000000" font-family="sans-serif" font-size="16.25" lengthAdjust="spacing" textLength="238.1602" x="1142.6875" y="198.1213">delta streams, scheduling hints</text></g><!--link RustCore to Host--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk14"><path d="M951.8,129.5 C911.2375,147.575 882.075,172.3125 906.05,203.25 