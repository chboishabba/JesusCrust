0005"><rect fill="#F1F1F1" height="72.6698" rx="3.125" ry="3.125" style="stroke:#181818;stroke-width:0.625;" width="406.621" x="872.7375" y="56.25"/><text fill="#000000" font-family="sans-serif" font-size="17.5" lengthAdjust="spacing" textLength="208.1442" x="885.2375" y="87.4574">Rust core / WASM worker</text><text fill="#000000" font-family="sans-serif" font-size="17.5" lengthAdjust="spacing" textLength="381.621" x="885.2375" y="111.2923">(store &#183; selectors &#183; scheduler &#183; patch generator)</text></g><!--entity Harness--><g class="entity" data-qualified-name="JesusCrust boundary.Harness" data-source-line="9" id="ent0006"><rect fill="#F1F1F1" height="72.6698" rx="3.125" ry="3.125" style="stroke:#181818;stroke-width:0.625;" width="395.596" x="1013.25" y="415.2875"/><text fill="#000000" font-family="sans-serif" font-size="17.5" lengthAdjust="spacing" textLength="169.2418" x="1025.75" y="446.4949">JS execution harness</text><text fill="#000000" font-family="sans-serif" font-size="17.5" lengthAdjust="spacing" textLength="370.596" x="1025.75" y="470.3298">(currently QuickJS-backed transactional tests)</text></g><!--entity Parser--><g class="entity" data-qualified-name="Brimstone engine subsystems.Parser" data-source-line="13" id="ent0008"><rect fill="#F1F1F1" height="48.8349" rx="3.125" ry="3.125" style="stroke:#181818;stroke-width:0.625;" width="238.5342" x="1091.775" y="619.825"/><text fill="#000000" font-family="sans-serif" font-size="17.5" lengthAdjust="spacing" textLength="213.5342" x="1104.275" y="651.0324">Parser &amp; bytecode builder</text></g><!--entity VM--><g class="entity" data-qualified-name="Brimstone engine subsystems.VM" data-source-line="14" id="ent0009"><rect fill="#F1F1F1" height="48.8349" rx="3.125" ry="3.125" style="stroke:#181818;stroke-width:0.625;" width="241.1592" x="1090.4625" y="767.4125"/><text fill="#000000" font-family="sans-serif" font-size="17.5" lengthAdjust="spacing" textLength="216.1592" x="1102.9625" y="798.6199">Bytecode